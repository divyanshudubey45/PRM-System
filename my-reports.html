<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>

<body>

    <header>
        <h1>My Medical Reports</h1>
        <p>Patient Report System</p>
    </header>


    <main class="reports-container">

        <div class="reports-heading">

            <div>
                <h2>Medical Reports</h2>
                <p>View and download your medical reports</p>
            </div>

            <a href="patient-dashboard.html" class="back-button">
                ← Dashboard
            </a>

        </div>


        <div class="reports-table-container">

            <table>

                <thead>

                    <tr>
                        <th>Report</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>


                <tbody id="reportsTable">

                    <!-- Reports will be added by JavaScript -->

                </tbody>

            </table>

        </div>

    </main>


    <!-- View Report Modal -->

    <div id="reportModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeReport()">
                &times;
            </span>

            <div id="reportDetails">

            </div>

            <button
                class="download-modal-button"
                onclick="downloadCurrentReport()">

                📥 Download PDF

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
