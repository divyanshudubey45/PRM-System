<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Doctor Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Patient Report System</h1>
        <p>Doctor Login</p>
    </header>


    <main class="login-container">

        <div class="login-card">

            <h2>Doctor Login</h2>

            <p class="login-subtitle">
                Login to manage patient reports
            </p>


            <form id="doctorLoginForm">

                <label for="doctorEmail">
                    Email / Doctor ID
                </label>

                <input
                    type="text"
                    id="doctorEmail"
                    placeholder="Enter email or doctor ID"
                    required
                >


                <label for="doctorPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="doctorPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">
                New Doctor?
                <a href="doctor-register.html">
                    Create Account
                </a>
            </p>


            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
